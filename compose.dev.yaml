name: ppotto-dev

services:
  caddy:
    env_file:
      - .env.dev

  app:
    image: ${APP_IMAGE:-ppotto-server:dev}
    env_file:
      - .env.dev
    environment:
      CORS_ALLOWED_ORIGINS: "*"
      SENTRY_ENVIRONMENT: dev
      SENTRY_TRACES_SAMPLE_RATE: "1.0"
    volumes:
      - ../secrets/gcs-dev-service-account.json:/run/secrets/gcs-service-account.json:ro,z
      - ../secrets/apple-auth-key.p8:/run/secrets/apple-auth-key.p8:ro,z

  postgres:
    env_file:
      - .env.dev
    mem_limit: 2g

  valkey:
    env_file:
      - .env.dev
