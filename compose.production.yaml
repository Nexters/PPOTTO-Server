name: ppotto-production

services:
  caddy:
    env_file:
      - .env.production

  app:
    image: ${APP_IMAGE:-ppotto-server:production}
    env_file:
      - .env.production
    environment:
      CORS_ALLOWED_ORIGINS: "*"
      SENTRY_ENVIRONMENT: production
      SENTRY_TRACES_SAMPLE_RATE: "1.0"
      SENTRY_PROFILE_SESSION_SAMPLE_RATE: "1.0"
    volumes:
      - ../secrets/gcs-production-service-account.json:/run/secrets/gcs-service-account.json:ro,z
      - ../secrets/apple-auth-key.p8:/run/secrets/apple-auth-key.p8:ro,z
      - ../secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro,z

  postgres:
    env_file:
      - .env.production
    mem_limit: 2g

  valkey:
    env_file:
      - .env.production
