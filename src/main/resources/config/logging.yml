logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} : %msg%n"
  level:
    com.github.nexters.ppotto: info

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.github.nexters.ppotto: debug
    org.jooq.tools.LoggerListener: debug
