name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  configure:
    name: 배포 대상 결정
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.target.outputs.label }}
      branch: ${{ steps.target.outputs.branch }}
      environment: ${{ steps.target.outputs.environment }}
      compose_file: ${{ steps.target.outputs.compose_file }}
      health_url: ${{ steps.target.outputs.health_url }}
    steps:
      - name: 브랜치별 설정 선택
        id: target
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          case "$HEAD_BRANCH" in
            dev)
              echo "label=Dev" >> "$GITHUB_OUTPUT"
              echo "branch=dev" >> "$GITHUB_OUTPUT"
              echo "environment=development" >> "$GITHUB_OUTPUT"
              echo "compose_file=compose.dev.yaml" >> "$GITHUB_OUTPUT"
              echo "health_url=https://dev-api.ppotto.co.kr/actuator/health" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "label=Production" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "compose_file=compose.production.yaml" >> "$GITHUB_OUTPUT"
              echo "health_url=https://api.ppotto.co.kr/actuator/health" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit 1
              ;;
          esac

  deploy:
    name: ${{ needs.configure.outputs.label }} 배포
    needs: configure
    runs-on: ubuntu-latest
    environment: ${{ needs.configure.outputs.environment }}
    concurrency:
      group: ppotto-${{ needs.configure.outputs.environment }}-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_BRANCH: ${{ needs.configure.outputs.branch }}
      COMPOSE_FILE: ${{ needs.configure.outputs.compose_file }}
      HEALTH_URL: ${{ needs.configure.outputs.health_url }}
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
      REGISTRY_REPOSITORY: ${{ secrets.REGISTRY_REPOSITORY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: 배포 설정 검증
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$REGISTRY_HOST"
          test -n "$REGISTRY_REPOSITORY"
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_PASSWORD"

      - name: 소스 체크아웃
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: Container Registry 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_REPOSITORY }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=${{ needs.configure.outputs.environment }}
          cache-to: type=gha,mode=max,scope=${{ needs.configure.outputs.environment }}

      - name: SSH 설정
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 서버 배포
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:?DEPLOY_PORT secret is not set}"
          image="${REGISTRY_HOST}/${REGISTRY_REPOSITORY}:${DEPLOY_SHA}"
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_SHA' '$DEPLOY_BRANCH' '$COMPOSE_FILE' '$image'" <<'REMOTE'
          set -euo pipefail
          deploy_sha="$1"
          deploy_branch="$2"
          compose_file="$3"
          image="$4"
          repository=/home/ppotto/src

          cd "$repository"
          test -z "$(git status --porcelain)"
          git fetch origin "$deploy_branch"

          if git show-ref --verify --quiet "refs/heads/$deploy_branch"; then
            git switch "$deploy_branch"
          else
            git switch --track -c "$deploy_branch" "origin/$deploy_branch"
          fi

          git merge --ff-only "$deploy_sha"
          test "$(git rev-parse HEAD)" = "$deploy_sha"
          APP_IMAGE="$image" SENTRY_RELEASE="$deploy_sha" docker compose \
            -f compose.deploy.yaml \
            -f "$compose_file" \
            config -q
          APP_IMAGE="$image" SENTRY_RELEASE="$deploy_sha" docker compose \
            -f compose.deploy.yaml \
            -f "$compose_file" \
            pull
          APP_IMAGE="$image" SENTRY_RELEASE="$deploy_sha" docker compose \
            -f compose.deploy.yaml \
            -f "$compose_file" \
            up -d --no-build --remove-orphans
          APP_IMAGE="$image" SENTRY_RELEASE="$deploy_sha" docker compose \
            -f compose.deploy.yaml \
            -f "$compose_file" \
            ps
          REMOTE

      - name: 헬스체크
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            "$HEALTH_URL"
