name: 기능 요청
description: 새로운 기능을 제안해주세요
labels:
  - 기능
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 이 기능이 왜 필요한지 설명해주세요
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 어떤 기능을 어떻게 만들지 적어주세요
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려한 다른 방법이 있다면 적어주세요
    validations:
      required: false
