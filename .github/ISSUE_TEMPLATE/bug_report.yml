name: 버그 제보
description: 동작하지 않는 부분을 알려주세요
labels:
  - 버그
body:
  - type: textarea
    id: description
    attributes:
      label: 현상
      description: 어떤 문제가 발생했는지 설명해주세요
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 문제를 재현하는 단계를 순서대로 적어주세요
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상이라면 어떻게 동작해야 하는지 적어주세요
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 프로파일, 브랜치, 커밋 해시 등
    validations:
      required: false
