services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: ppotto-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ppotto}
      POSTGRES_USER: ${POSTGRES_USER:-ppotto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppotto}
    ports:
      - "${POSTGRES_PORT:-54782}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppotto} -d ${POSTGRES_DB:-ppotto}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: ppotto-valkey
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  valkey-data:
